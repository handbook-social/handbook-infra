version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: handbook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - handbook-network

  server-api:
    build:
      context: ../server-api
      dockerfile: Dockerfile
    container_name: handbook-server-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../server-api/.env
    environment:
      - NODE_ENV=production
      - PORT=8000
      # MONGODB_URI được nạp tự động từ tệp .env (qua env_file) để trỏ đến MongoDB Atlas
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CLIENT_URL=http://localhost:3000
      - REALTIME_SERVICE_URL=http://realtime-server:5000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://client:3000
    depends_on:
      - redis
    networks:
      - handbook-network

  realtime-server:
    build:
      context: ../realtime-server
      dockerfile: Dockerfile
    container_name: handbook-realtime-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ../realtime-server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      # MONGODB_URI được nạp tự động từ tệp .env (qua env_file) để trỏ đến MongoDB Atlas
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SERVER_API_URL=http://server-api:8000/api/v1
    depends_on:
      - redis
    networks:
      - handbook-network

  prometheus:
    image: prom/prometheus:latest
    container_name: handbook-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - handbook-network

  grafana:
    image: grafana/grafana:latest
    container_name: handbook-grafana
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - handbook-network

networks:
  handbook-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
